[project]
name = "devstack"
version = "0.1.0"
description = "My personal setup."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ll-nick" }]
dependencies = [
  "pyinfra>=3.10.0",
]

[dependency-groups]
dev = [
  "basedpyright>=1.40.2",
  "poethepoet>=0.49.0",
  "pytest>=9.2.0",
  "ruff>=0.17.3",
]

[project.scripts]
devstack = "devstack.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.poe.tasks]
lint = "ruff check --fix"
lint-check = "ruff check"
format = "ruff format"
format-check = "ruff format --check"
typecheck = "basedpyright"
lint-lock = "uv lock --check"
fix = ["lint", "format"]
check = ["lint-check", "format-check", "typecheck", "lint-lock"]

[tool.pyright]
include = ["src"]
reportUnusedCallResult = "none"
reportMissingTypeStubs = "none"

[tool.ruff]
include = ["src/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest]
testpaths = ["src"]
