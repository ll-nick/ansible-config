- name: Full setup
  hosts: local
  pre_tasks:
    - name: Pre-Run // Update pacman cache
      become: true
      pacman: update_cache=yes
      changed_when: false
      when:
        - run_privileged
        - ansible_distribution == "Archlinux"

    - name: Pre-Run // Update apt cache
      become: true
      apt: update_cache=yes
      changed_when: false
      when:
        - run_privileged
        - ansible_distribution in ["Debian", "Ubuntu"]

    - tags: always
      block:
        - name: Check if host has a display
          set_fact:
            has_display: >-
              {{
                (ansible_facts['env']['DISPLAY'] is defined
                 and ansible_facts['env']['DISPLAY'] is match('^:[0-9]'))
                or
                (ansible_facts['env']['WAYLAND_DISPLAY'] is defined
                 and ansible_facts['env']['WAYLAND_DISPLAY'] | length > 0)
              }}
        - debug:
            msg: >-
              {{
                "Host has a display" if has_display
                else "Host does not have a display"
              }}

        - name: Check if host is the research vehicle Joy
          set_fact:
            is_joy: "{{ ansible_facts['hostname'] == 'mrtjoy' }}"

        - name: Check if Inkscape is available
          ansible.builtin.command: which inkscape
          register: inkscape_check
          failed_when: false
          changed_when: false
        - name: Set Inkscape availability fact
          set_fact:
            inkscape_available: "{{ inkscape_check.rc == 0 }}"

        - name: Check GitHub SSH access
          ansible.builtin.command: ssh -T git@github.com
          register: github_ssh_test
          failed_when: false
          changed_when: false
        - name: Set GitHub prefix
          set_fact:
            github_prefix: >-
              {{
                "git@github.com:"
                if github_ssh_test.rc in [0, 1]
                else "https://github.com/"
              }}
        - debug:
            msg: "GitHub prefix set to {{ github_prefix }}"


  roles:
    - role: ansible
      tags: ansible



