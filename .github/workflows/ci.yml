name: CI

on:
  push:
    branches: [main, pyinfra]
  pull_request:

jobs:
  check:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Run checks
        run: uv run poe check

  test-ubuntu:
    name: Apply on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Build CI image
        run: ci/run.sh build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installed tools and configs
        run: ci/run.sh verify

      - name: Idempotency check
        run: ci/run.sh idempotency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
