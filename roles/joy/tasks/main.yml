- name: Add bash config
  ansible.builtin.copy:
    src: joy.bash
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/bash/joy.bash"

- name: Silence the setup hint of the shared dotfiles
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
    state: touch
    modification_time: preserve
    access_time: preserve

- name: Add machine-local git config
  ansible.builtin.copy:
    src: joy.gitconfig
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/local.gitconfig"

- name: Ensure stk config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/stk"
    state: directory

- name: Skip system updates in stk
  ansible.builtin.copy:
    src: stk-skip
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/stk/skip"

# The tmux service stops the tmux server, and everything running in it,
# when the last session of the user ends
- name: Check for tmux autostart service
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/systemd/user/tmux.service"
  register: tmux_service

- name: Disable tmux autostart service
  ansible.builtin.systemd:
    unit: tmux
    enabled: false
    scope: user
  when: tmux_service.stat.exists
