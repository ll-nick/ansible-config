- name: Add bash config
  ansible.builtin.copy:
    src: joy.bash
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/bash/joy.bash"

- name: Silence the setup hint of the shared dotfiles
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.dotfiles"
    state: touch
    modification_time: preserve
    access_time: preserve

- name: Add machine-local git config
  ansible.builtin.copy:
    src: joy.gitconfig
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/git/local.gitconfig"

