- name: Copy mise config
  ansible.builtin.copy:
    src: mise.toml
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/mise/conf.d/claude.toml"

- name: Install
  ansible.builtin.command:
    cmd: "{{ ansible_facts['env']['HOME'] }}/.local/bin/mise install"
  changed_when: false

- name: Ensure config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude"
    state: directory

- name: Add Claude config files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/{{ item.dest }}"
    mode: "{{ item.mode | default(omit) }}"
  loop:
    - { src: CLAUDE.md.j2, dest: CLAUDE.md }
    - { src: statusline-command.sh.j2, dest: statusline-command.sh }
    - { src: fetch-usage-limits.sh.j2, dest: fetch-usage-limits.sh, mode: "0755" }
  loop_control:
    label: "{{ item.dest }}"

# settings.json is merged with the managed settings
- name: Check for existing settings
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: claude_settings_stat

- name: Read existing settings
  ansible.builtin.slurp:
    src: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"
  register: claude_settings_slurp
  when: claude_settings_stat.stat.exists

- name: Merge settings
  ansible.builtin.set_fact:
    claude_settings: >-
      {{
        (claude_settings_slurp.content | b64decode | from_json
         if claude_settings_stat.stat.exists else {})
        | combine(claude_managed_settings)
      }}

- name: Write settings
  ansible.builtin.copy:
    content: "{{ claude_settings | to_nice_json(indent=2) }}\n"
    dest: "{{ ansible_facts['env']['HOME'] }}/.claude/settings.json"

- name: Add bash config
  ansible.builtin.copy:
    src: claude.bash
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/bash/claude.bash"

- name: Add nushell config
  ansible.builtin.copy:
    src: claude.nu
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/nushell/autoload/claude.nu"
